    Q_pos_z: 1.0
    Q_vel_x: 0.1
    Q_vel_y: 0.1
    Q_vel_z: 0.1
    Q_quat_x: 0.01
    Q_quat_y: 0.01
    Q_quat_z: 0.01
    R_w_x: 0.1
    R_w_y: 0.1
    R_w_z: 0.1
    R_acc_z: 0.1

  force_params:
    Q_pos_x: 1.0
    Q_pos_y: 1.0
    Q_pos_z: 1.0
    Q_vel_x: 0.1
    Q_vel_y: 0.1
    Q_vel_z: 0.1
    Q_quat_x: 0.01
    Q_quat_y: 0.01
    Q_quat_z: 0.01
    Q_w_x: 0.01
    Q_w_y: 0.01
    Q_w_z: 0.01
    R_force_0: 0.1
    R_force_1: 0.1
    R_force_2: 0.1
    R_force_3: 0.1

  dforce_params:
    Q_pos_x: 1.0
    Q_pos_y: 1.0
    Q_pos_z: 1.0
    Q_vel_x: 0.1
    Q_vel_y: 0.1
    Q_vel_z: 0.1
    Q_quat_x: 0.01
    Q_quat_y: 0.01
    Q_quat_z: 0.01
    Q_w_x: 0.01
    Q_w_y: 0.01
    Q_w_z: 0.01
    Q_force_0: 0.1
    Q_force_1: 0.1
    Q_force_2: 0.1
    Q_force_3: 0.1
    R_dforce_0: 0.1
    R_dforce_1: 0.1
    R_dforce_2: 0.1
    R_dforce_3: 0.1

